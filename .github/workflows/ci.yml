name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    name: Lint and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest

      - name: Check code formatting with Black
        run: black --check .

      - name: Lint code with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # - name: Run PyTest
      #   run: pytest tests/

  docker-build-check:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    strategy:
      matrix:
        service:
          - inference-service
          - monitoring-service
          - orchestrator
          - training_worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build inference-service
        if: matrix.service == 'inference-service'
        run: docker build -t mlops/inference-service:test -f services/inference-service/Dockerfile .

      - name: Build monitoring-service
        if: matrix.service == 'monitoring-service'
        run: docker build -t mlops/monitoring-service:test -f services/monitoring-service/Dockerfile .

      - name: Build orchestrator
        if: matrix.service == 'orchestrator'
        run: docker build -t mlops/orchestrator:test -f services/orchestrator/Dockerfile .

      - name: Build training_worker
        if: matrix.service == 'training_worker'
        run: docker build -t mlops/training_worker:test -f services/training_worker/Dockerfile .
