name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    name: Lint and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest

      - name: Check code formatting with Black
        run: black --check .

      - name: Lint code with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Uncomment the following lines when tests are added to the /tests directory
      # - name: Run PyTest
      #   run: pytest tests/

  docker-build-check:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service:
          - inference-service
          - monitoring-service
          - orchestrator
          - training-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image for ${{ matrix.service }}
        run: |
          docker build -t mlops/${{ matrix.service }}:test ./services/${{ matrix.service }}
