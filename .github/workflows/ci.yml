name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "dev", "integration/**" ]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_USER: mlops
  POSTGRES_PASSWORD: mlops
  POSTGRES_DB: mlops_test

jobs:
  lint-and-test:
    name: Lint and Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pytest pytest-asyncio httpx
          pip install -r services/inference_service/requirements.txt
          pip install -r services/orchestrator/requirements.txt
          pip install -r services/training_worker/requirements.txt
          pip install -r services/monitoring_service/requirements.txt
          pip install -r pipelines/first_ml_baseline/requirements.txt

      - name: Check code formatting with Black
        run: black --check . || true

      - name: Lint code with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --ignore=E501,W503 || true

      - name: Set environment variables
        run: |
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_USER=${{ env.POSTGRES_USER }}" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}" >> $GITHUB_ENV
          echo "POSTGRES_DB=${{ env.POSTGRES_DB }}" >> $GITHUB_ENV
          echo "MINIO_ROOT_USER=minio" >> $GITHUB_ENV
          echo "MINIO_ROOT_PASSWORD=minio123" >> $GITHUB_ENV
          echo "MINIO_ENDPOINT=localhost:9000" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=http://localhost:5000" >> $GITHUB_ENV

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run service tests
        run: pytest tests/services_tests/ -v --tb=short

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - orchestrator
          - training_worker
          - inference_service
          - monitoring_service
          - monitoring_dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          docker build -t mlops/${{ matrix.service }}:test \
            -f services/${{ matrix.service }}/Dockerfile .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
