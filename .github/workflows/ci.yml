name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    name: Lint and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pytest-asyncio httpx
          pip install fastapi uvicorn pydantic asyncpg minio sqlalchemy psycopg2-binary mlflow boto3 python-multipart tenacity cachetools

      - name: Check code formatting with Black
        run: black --check .

      - name: Lint code with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run PyTest
        run: pytest tests/ --ignore=tests/integration/ -v --tb=short

  docker-build-check:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    strategy:
      matrix:
        service:
          - inference_service
          - monitoring_service
          - orchestrator
          - training_worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build inference_service
        if: matrix.service == 'inference_service'
        run: docker build -t mlops/inference_service:test -f services/inference_service/Dockerfile .

      - name: Build monitoring_service
        if: matrix.service == 'monitoring_service'
        run: docker build -t mlops/monitoring_service:test -f services/monitoring_service/Dockerfile .

      - name: Build orchestrator
        if: matrix.service == 'orchestrator'
        run: docker build -t mlops/orchestrator:test -f services/orchestrator/Dockerfile .

      - name: Build training_worker
        if: matrix.service == 'training_worker'
        run: docker build -t mlops/training_worker:test -f services/training_worker/Dockerfile .

      - name: Build monitoring-dashboard
        if: matrix.service == 'monitoring-dashboard'
        run: docker build -t mlops/monitoring-dashboard:test -f services/monitoring-dashboard/Dockerfile .
