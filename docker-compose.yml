services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

  minio-seed:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./seeds:/seeds
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/datasets;
      mc mb --ignore-existing myminio/models;
      mc cp /seeds/sample_dataset.csv myminio/datasets/test_data;
      echo 'Seed complete.';
      "

  mlflow:
    build: ./services/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  orchestrator:
    build: ./services/orchestrator
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mlflow
      - minio-seed
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  training-worker:
    build:
      context: .
      dockerfile: services/training_worker/Dockerfile
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      - postgres
      - mlflow
      - minio-seed
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.5"

  inference_service:
    build: ./services/inference_service
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      - mlflow
      - minio
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  monitoring-service:
    build: ./services/monitoring-service
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  monitoring-dashboard:
    build: ./services/monitoring-dashboard
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - postgres
      - orchestrator
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  postgres_data:
  minio_data:
  mlflow_data:
